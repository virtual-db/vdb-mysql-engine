// vdb.proto: the plug-in protocol between vdb.so and vdb-mysql
// (implementation plan doc 07, D-81). One message per request and reply.
// Both codecs are generated from this file: Go with protoc-gen-go, C++ with
// the protoc that MySQL builds in its own tree. Frames, op codes and the
// version live in the Go package (ops.go, frame.go, version.go) and in
// vdb-mysql-plugins/src/common/proto.h.
syntax = "proto3";

package vdb;

option go_package = "github.com/virtual-db/vdb-mysql-engine/protocol";
option optimize_for = LITE_RUNTIME;

// ── Logical types (doc 07 §2) ──

// Value is NULL or bytes in MySQL's text form.
message Value {
  bool null = 1;
  bytes b = 2;
}

message Row {
  repeated Value values = 1;
}

// Key is MySQL's key format plus the sort image.
message Key {
  bytes raw = 1;
  bytes image = 2;
}

// Range bounds on an index: raw bounds for the Source, images for the Delta.
// An absent low or high is an open bound.
message Range {
  Key low = 2;
  bool low_incl = 3;
  uint32 low_parts = 4;
  Key high = 6;
  bool high_incl = 7;
  uint32 high_parts = 8;
}

enum Origin {
  ORIGIN_SOURCE = 0;
  ORIGIN_DELTA = 1;
}

// RowRef identifies a row for update_row and delete_row. For updates and
// deletes, whole carries the old row's every column.
message RowRef {
  Origin origin = 1;
  Key pk = 2;
  bytes source_key = 3;
  Row whole = 4;
  // new_lock is set by vdb-mysql on a row a locking read returned when that
  // read newly created the row's record lock, in this mode (InnoDB's
  // new_rec_lock). vdb.so sends Unlock for the current row only when it is
  // set, and sends the ref back unchanged; a lock the transaction already
  // held is never released (row_prebuilt_t::try_unlock).
  LockMode new_lock = 5;
}

// Images holds the sort image of every index of one row, by index id.
message Images {
  repeated bytes images = 1;
}

message Warning {
  uint32 code = 1;
  string text = 2;
}

// ── All connections (§3.1) ──

enum ConnKind {
  CONN_DATA = 0;
  CONN_LOGIN = 1;
  CONN_EVENT = 2;
  CONN_KILL = 3;
}

message Hello {
  uint32 version = 1;
  ConnKind kind = 2;
  string build = 3;
  uint64 conn_id = 4;
}

message HelloReply {
  uint32 version = 1;
  string build = 2;
  bool query_intercept = 3;
}

// ── Errors (§4) ──

message Error {
  uint32 code = 1;
  uint32 index = 2;
  string constraint = 3;
  uint64 holder = 4;
  string message = 5;
}

// Waiting is sent before the final reply of a request that blocks on a row lock.
message Waiting {
  uint64 holder = 1;
}

// ImagesNeeded asks vdb.so for the sort images of rows a cascade writes (D-86).
message ImagesNeeded {
  uint32 table = 1;
  repeated Row rows = 2;
  string database = 3;
  string name = 4;
}

message ImagesReply {
  repeated Images rows = 1;
  Error error = 2;
}

// ── Data channel (§3.2) ──

message TableOpen {
  string database = 1;
  string table = 2;
}

enum TableKind {
  KIND_MIRRORED = 0;
  KIND_LOCAL = 1;
  KIND_DETACHED = 2;
  KIND_PROVIDED = 3;
}

message IndexFlags {
  uint32 id = 1;
  string name = 2;
  bool ordered = 3;
  bool equality_proven = 4;
}

enum FetchMode {
  FETCH_SOURCE = 0;
  FETCH_DEFAULT = 1;
  FETCH_VIRTUAL = 2;
  FETCH_TRANSFORMED = 3;
}

message TableOpenReply {
  uint32 table = 1;
  uint64 version = 2;
  TableKind kind = 3;
  repeated IndexFlags indexes = 4;
  repeated FetchMode fetch = 5;
  bool shadow_check = 6;
  uint32 identity = 7; // 0xFFFF: no usable key
}

enum Isolation {
  REPEATABLE_READ = 0;
  READ_COMMITTED = 1;
  READ_UNCOMMITTED = 2;
  SERIALIZABLE = 3;
}

enum LockMode {
  LOCK_NONE = 0;
  LOCK_SHARED = 1;
  LOCK_EXCLUSIVE = 2;
}

// ThrLockType is mysqld's thr_lock_type (include/thr_lock.h), one name per
// value. vdb.so fills it with a switch over mysqld's named constants, so a
// renumbering in a mysqld release cannot drift; vdb-mysql treats
// THR_LOCK_UNSPECIFIED and any value it does not know as a locking read.
enum ThrLockType {
  THR_LOCK_UNSPECIFIED = 0;
  TL_IGNORE = 1;
  TL_UNLOCK = 2;
  TL_READ_DEFAULT = 3;
  TL_READ = 4;
  TL_READ_WITH_SHARED_LOCKS = 5;
  TL_READ_HIGH_PRIORITY = 6;
  TL_READ_NO_INSERT = 7;
  TL_WRITE_ALLOW_WRITE = 8;
  TL_WRITE_CONCURRENT_DEFAULT = 9;
  TL_WRITE_CONCURRENT_INSERT = 10;
  TL_WRITE_DEFAULT = 11;
  TL_WRITE_LOW_PRIORITY = 12;
  TL_WRITE = 13;
  TL_WRITE_ONLY = 14;
}

// SqlCommand is mysqld's enum_sql_command for the commands InnoDB's read
// lock rule tests (ha_innobase::store_lock, start_stmt), filled 1:1 from
// mysqld's named constants; every other command is SQL_COMMAND_OTHER.
// UNSPECIFIED, OTHER and unknown values all mean "not a plain SELECT", which
// in InnoDB's rule is a locking read, never a snapshot read.
enum SqlCommand {
  SQL_COMMAND_UNSPECIFIED = 0;
  SQL_COMMAND_OTHER = 1;
  SQL_COMMAND_SELECT = 2;
  SQL_COMMAND_INSERT_SELECT = 3;
  SQL_COMMAND_REPLACE_SELECT = 4;
  SQL_COMMAND_UPDATE = 5;
  SQL_COMMAND_CREATE_TABLE = 6;
  SQL_COMMAND_CHECKSUM = 7;
  SQL_COMMAND_LOCK_TABLES = 8;
  SQL_COMMAND_FLUSH = 9;
  SQL_COMMAND_DROP_TABLE = 10;
  SQL_COMMAND_INSERT = 11;
  SQL_COMMAND_DELETE = 12;
  SQL_COMMAND_REPLACE = 13;
  SQL_COMMAND_UPDATE_MULTI = 14;
  SQL_COMMAND_DELETE_MULTI = 15;
  SQL_COMMAND_HA_READ = 16;
}

// ExternalLock is the lock_type mysqld last passed to handler::external_lock
// for the statement (F_RDLCK or F_WRLCK).
enum ExternalLock {
  EXTERNAL_LOCK_UNSPECIFIED = 0;
  EXTERNAL_LOCK_READ = 1;
  EXTERNAL_LOCK_WRITE = 2;
}

// ReadLockFacts are the raw values mysqld gave a table handle at the calls
// where InnoDB decides a read's lock (doc: handoff #18). vdb.so records them
// and decides nothing; vdb-mysql replays InnoDB's store_lock, external_lock
// and start_stmt on them in call order, with the statement's isolation and
// autocommit from StmtBegin, and picks the lock mode.
message ReadLockFacts {
  // The last store_lock call whose lock type was not TL_IGNORE (InnoDB
  // leaves its state unchanged on TL_IGNORE): the type as mysqld passed it,
  // before vdb.so's own rewrite for mysqld's table lock.
  ThrLockType store_lock_type = 1;
  SqlCommand store_sql_command = 2;
  bool store_in_lock_tables = 3;
  // external_lock of the statement, or of LOCK TABLES.
  ExternalLock external_lock = 4;
  // start_stmt, when mysqld called it after external_lock (statements under
  // LOCK TABLES); its lock type and the command read again at that call.
  bool start_stmt = 5;
  ThrLockType start_stmt_type = 6;
  SqlCommand start_stmt_sql_command = 7;
  // init_table_handle_for_HANDLER was called after external_lock (HANDLER
  // ... READ).
  bool for_handler = 8;
}

message Setting {
  string name = 1;
  string value = 2;
}

message StmtBegin {
  string account = 1;
  string database = 2;
  bool control = 3;
  Isolation isolation = 4;
  bool autocommit = 5;
  reserved 6;  // lock_intent, never set; read locks come from ReadLockFacts
  bool foreign_key_checks = 7;
  uint32 lock_wait_ms = 8;
  bool bka = 9;
  repeated Setting eval = 10;
  bool read_only = 11;
  string digest = 12;
}

// Empty is the body of requests and replies that carry nothing.
message Empty {
  repeated Warning warnings = 1;
}

message Savepoint {
  string name = 1;
}

enum ScanKind {
  SCAN_UNORDERED = 0;
  SCAN_PRIMARY_RANGE = 1;
  SCAN_INDEX_RANGE = 2;
  SCAN_MULTI_RANGE = 3;
}

message ScanOpen {
  uint32 table = 1;
  uint64 version = 2;
  uint32 index = 3;
  ScanKind kind = 4;
  repeated Range ranges = 5;
  bool backward = 6;
  repeated uint32 columns = 7;
  string pushed = 8;
  reserved 9;  // lock: replaced by facts
  uint32 max_rows = 10;
  ReadLockFacts facts = 11;
}

enum CursorKind {
  CURSOR_MERGED = 0;
  CURSOR_SOURCE = 1;
  CURSOR_DELTA = 2;
}

message Batch {
  repeated Row rows = 1;
  repeated RowRef refs = 2;
  repeated uint32 key_idx = 3;
  bool end = 4;
}

message ScanOpenReply {
  uint32 scan = 1;
  Batch merged = 2;
  Batch source = 3;
  Batch delta = 4;
  repeated bytes shadow_images = 5;
  repeated Warning warnings = 6;
}

message ScanNext {
  uint32 scan = 1;
  CursorKind cursor = 2;
  uint32 max_rows = 3;
}

message ScanNextReply {
  Batch batch = 1;
  repeated Warning warnings = 2;
}

message ScanClose {
  uint32 scan = 1;
}

// Unlock (vdb.so handler::unlock_row) releases the lock a locking read took
// for one row it returned and the statement did not keep: at READ COMMITTED
// mysqld calls it for every row that fails the WHERE. ref is the row's
// reference from the batch; vdb.so sends it only when ref.new_lock is set,
// and vdb-mysql releases only that mode's lock. Reply: Empty.
message Unlock {
  uint32 table = 1;
  RowRef ref = 2;
}

message Lookup {
  uint32 table = 1;
  uint64 version = 2;
  uint32 index = 3;
  repeated Key keys = 4;
  repeated uint32 columns = 5;
  reserved 6;  // lock: replaced by facts
  ReadLockFacts facts = 7;
}

message LookupReply {
  Batch batch = 1;
  bytes continuation = 2;
  repeated bytes shadow_images = 3;
  repeated Warning warnings = 4;
}

message LookupNext {
  bytes continuation = 1;
}

// Count asks for an exact row count (handler::records). vdb-mysql declines
// it when the read would lock: mysqld then counts through a locking scan,
// as InnoDB's records() does.
message Count {
  uint32 table = 1;
  ReadLockFacts facts = 2;
}

message CountReply {
  uint64 count = 1;
  bool declined = 2;
}

message Stats {
  uint32 table = 1;
  // When range is set, records_in_range is asked for it on this index.
  uint32 index = 3;
  Range range = 4;
  // whole_table_delete says the statement is a single-table DELETE of every
  // row (no WHERE, or a constant true one, and no LIMIT), as vdb.so reads it
  // from mysqld's parse. mysqld reports records as the affected-rows count
  // of delete_all_rows, so vdb-mysql answers with an exact count when it can.
  bool whole_table_delete = 5;
}

message IndexStats {
  uint32 index = 1;
  repeated double rec_per_key = 2;
}

message StatsReply {
  uint64 records = 1;
  uint64 mean_rec_length = 2;
  uint64 mrr_length_per_rec = 3;
  repeated IndexStats indexes = 4;
  uint64 records_in_range = 5;
  double batch_cost = 6;
  bool estimated = 7;
  uint64 data_file_length = 8;
}

message Insert {
  uint32 table = 1;
  Row row = 2;
  Images images = 3;
}

message InsertBatch {
  uint32 table = 1;
  repeated Row rows = 2;
  repeated Images images = 3;
}

message WriteResult {
  bool ok = 1;
  Error error = 2;
}

message InsertReply {
  repeated WriteResult results = 1;
  repeated Warning warnings = 2;
}

message Update {
  uint32 table = 1;
  RowRef old = 2;
  Row row = 3;
  Images images = 4;
}

message Delete {
  uint32 table = 1;
  RowRef old = 2;
}

message AutoIncrement {
  uint32 table = 1;
  uint64 count = 2;
}

message AutoIncrementReply {
  uint64 first = 1;
  uint64 granted = 2;
}

message Truncate {
  uint32 table = 1;
}

// DeleteAll (vdb.so handler::delete_all_rows) is a DELETE without WHERE: the
// table is detached from the Source like TRUNCATE, but inside the
// transaction and keeping AUTO_INCREMENT. Reply: DeleteAllReply.
message DeleteAll {
  uint32 table = 1;
}

// DeleteAllReply: deleted is the affected-rows count. declined means nothing
// was changed and vdb.so lets mysqld delete row by row (the table has
// foreign-key children to check or cascade, or its row count was declined).
message DeleteAllReply {
  uint64 deleted = 1;
  bool declined = 2;
}

// ── Catalog definitions ──

message ColumnDef {
  string name = 1;
  string type = 2;
  string charset = 3;
  string collation = 4;
  bool nullable = 5;
  bool virtual_gen = 6;
  bool timestamp = 7;
  bool float = 8;
  bool auto_increment = 9;
  bool has_default = 10;
  Value default_value = 11;
}

message IndexDef {
  string name = 1;
  bool primary = 2;
  bool unique = 3;
  repeated uint32 columns = 4;
  repeated uint32 part_lens = 5;
  repeated string collations = 6;
  bool fulltext_or_spatial = 7;
}

message ForeignKeyDef {
  string name = 1;
  repeated uint32 columns = 2;
  string parent_db = 3;
  string parent_table = 4;
  repeated string parent_columns = 5;
  uint32 on_delete = 6; // 0 restrict, 1 no action, 2 cascade, 3 set null
  uint32 on_update = 7;
  uint32 child_index = 8;
}

message TableDefinition {
  string database = 1;
  string name = 2;
  string definition = 3;
  repeated ColumnDef columns = 4;
  repeated IndexDef indexes = 5;
  repeated ForeignKeyDef foreign_keys = 6;
  bool temporary = 7;
}

enum CatalogKind {
  CATALOG_CREATE = 0;
  CATALOG_DROP = 1;
  CATALOG_RENAME = 2;
}

message Catalog {
  CatalogKind kind = 1;
  TableDefinition table = 2;
  uint32 table_id = 3; // drop, rename
  string new_database = 4;
  string new_name = 5;
}

message CatalogReply {
  uint32 table = 1;
  uint64 version = 2;
  repeated Warning warnings = 3;
}

enum AlterKind {
  ALTER_OTHER = 0;
  ALTER_ADD_COLUMN = 1;
  ALTER_DROP_COLUMN = 2;
  ALTER_ADD_INDEX = 3;
  ALTER_DROP_INDEX = 4;
  ALTER_CHANGE_DEFAULT = 5;
  ALTER_ADD_FOREIGN_KEY = 6;
  ALTER_DROP_FOREIGN_KEY = 7;
  ALTER_RENAME_COLUMN = 8;
  ALTER_CHANGE_TYPE = 9;
  ALTER_CHANGE_KEY = 10;
  ALTER_OPTIONS = 11;
}

message Alter {
  uint32 table = 1;
  repeated AlterKind kinds = 2;
  string object = 3;
  TableDefinition table_def = 4;
  string statement = 5;
  bool copy_needed = 6; // mysqld asked for ALGORITHM=COPY
}

enum AlterVerdict {
  ALTER_OK = 0;
  ALTER_NEEDS_COPY = 1;
  ALTER_NEEDS_CONVERSION = 2;
}

message AlterReply {
  AlterVerdict verdict = 1;
  uint64 version = 2;
  string message = 3;
}

message AlterRows {
  uint32 table = 1;
}

message AlterPut {
  uint32 table = 1;
  repeated Row rows = 2;
  repeated Images images = 3;
}

// ── Kill (§3.3) ──

message Kill {
  uint64 conn_id = 1;
}

// ── Login channel (§3.4) ──

message AuthBegin {
  string user = 1;
  string host = 2;
  string method = 3; // caching_sha2_password or mysql_native_password
  bool secure = 4;   // client on TLS or a Unix socket
  bool tls = 5;      // client on TLS (REQUIRE SSL)
}

message AuthBeginReply {
  bytes scramble = 1;
  string method = 2;
  bool refused = 3;
  uint32 code = 4;
  string message = 5;
}

message AuthAnswer {
  bytes answer = 1;
}

enum AuthResult {
  AUTH_ACCEPTED = 0;
  AUTH_REFUSED = 1;
  AUTH_PASSWORD_NEEDED = 2;
}

message AuthReply {
  AuthResult result = 1;
  string account = 2;
  bool require_ssl = 3;
  uint32 code = 4;
  string message = 5;
  string user = 6;
  string host = 7;
}

message AuthPass {
  bytes password = 1;
}

// ── Event channel (§3.5) ──

message Rewrite {
  uint64 conn_id = 1;
  string statement = 2;
}

message ByteRange {
  uint32 start = 1;
  uint32 end = 2;
}

message RewriteReply {
  bool unchanged = 1;
  repeated ByteRange remove = 2;
}

message DdlCaptured {
  uint64 conn_id = 1;
  string statement = 2;
  string database = 3;
  string sql_mode = 4;
  string definer = 5;
  uint32 kind = 6; // sql_command_id
  string object_name = 7;
}

enum EventKind {
  EVENT_CONNECT = 0;
  EVENT_DISCONNECT = 1;
  EVENT_STATEMENT = 2;
}

message Event {
  EventKind kind = 1;
  uint64 conn_id = 2;
  string account = 3;
  string host = 4;
  string digest = 5;
  uint64 duration_us = 6;
  uint64 rows = 7;
  uint32 error_code = 8;
  string query = 9;
  string database = 10;
  uint64 rows_sent = 11;
}

message QueryReceived {
  uint64 conn_id = 1;
  string statement = 2;
  string database = 3;
}

message QueryReceivedReply {
  string statement = 1;
}
